[package]
authors = ["Databend Authors <opensource@datafuselabs.com>"]
categories = ["encoding"]
description = "JSONB implement in Rust."
edition = "2021"
homepage = "https://github.com/databendlabs/jsonb"
keywords = ["json", "jsonb", "jsonpath"]
license = "Apache-2.0"
name = "jsonb"
repository = "https://github.com/databendlabs/jsonb"
version = "0.5.6"
rust-version = "1.85"

[dependencies]
byteorder = "1.5.0"
ethnum = "1.5.2"
fast-float2 = "0.2.3"
itoa = "1.0"
jaq-json = "2.0.0"
jiff = "0.2.10"
nom = "8.0.0"
num-traits = "0.2.19"
ordered-float = { version = "5.1.0", default-features = false }
rand = { version = "0.9.2", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
zmij = "1.0"

[dev-dependencies]
criterion = "0.5.1"
goldenfile = "1.8"
json-deserializer = "0.4.4"
json-five = "0.3.0"
mockalloc = "0.1.2"
proptest = "1.7"
serde_json = "1.0"
simd-json = "0.15.0"

[features]
default = ["databend", "preserve_order", "arbitrary_precision"]
databend = []
sqlite = []
arbitrary_precision = ["serde_json/arbitrary_precision"]
preserve_order = ["serde_json/preserve_order"]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "get_path"
harness = false

[[bench]]
name = "strip_nulls"
harness = false
